name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine + app)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talks-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
