name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          echo "=== COMPILER / TEST ERRORS ==="
          grep -E "^e: |^w: .*(Unresolved|Deprecated)|error:|FAILED|AssertionError|What went wrong|Execution failed" -A2 build.log | grep -v "^\s*at " | head -120

      - name: Lint
        run: ./gradlew --console=plain :app:lintDebug
        continue-on-error: true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talks-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # Which screenshots (ASCII renderings) to print in the log, comma separated; "all" prints everything.
      SHOW_LABELS: "tablet-landscape,failure"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The SDK download is occasionally corrupted ("Error on ZipFile unknown archive"); retry it here so the
      # emulator action below finds the packages already installed.
      - name: Install emulator packages (with retries)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          install() {
            local pkg="$1"
            for attempt in 1 2 3 4 5; do
              sdkmanager --install "$pkg" > /tmp/sdk.log 2>&1 || true
              if sdkmanager --list_installed 2>/dev/null | grep -Eq "^[[:space:]]*${pkg}[[:space:]]*\|"; then
                echo "$pkg installed"
                return 0
              fi
              echo "::warning::$pkg not installed (attempt $attempt): $(tail -2 /tmp/sdk.log | tr '\n' ' ')"
              sleep 5
            done
            return 0
          }
          install "emulator"
          install "system-images;android-34;google_apis;x86_64"

      - name: Instrumented tests on a tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-ui-tests.sh

      - name: UI test results
        if: always()
        run: |
          echo "=== UI TEST SUMMARY ==="
          grep -E "^e: |FAILED|AssertionError|Tests? .*(passed|failed)|BUILD (SUCCESSFUL|FAILED)|Exception" gradle-ui.log | head -60 || true
          echo "=== UI TREE / DIAGNOSTICS ==="
          grep -E "TALKS_TEST|AndroidRuntime" ui-log.txt | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | head -60 || true
          echo "--- system ---"
          cat ui-system.txt 2>/dev/null | cut -c1-260 | head -30 || true
          for tag in TALKS_TREE_FAIL TALKS_TREE_TABLET; do
            echo "--- $tag ---"
            grep -F "$tag" ui-log.txt | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ D //' | head -70 || true
          done
          echo "=== SCREENSHOTS ($SHOW_LABELS) ==="
          for label in ${SHOW_LABELS//,/ }; do
            awk -v l="$label" '$0 ~ "===== "l" \\(" {p=1} p {print} $0 ~ "===== end "l" =====" {p=0}' ui-log.txt | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ I ASCII +: //' | head -80
          done
          if [ "$(cat ui-status.txt 2>/dev/null)" != "0" ]; then echo "UI TESTS FAILED"; exit 1; fi

      - name: Upload UI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: |
            ui-log.txt
            ui-system.txt
            gradle-ui.log
            app/build/reports/androidTests/**
          if-no-files-found: ignore

  # Pushing a tag such as v1.0.0 publishes the installable APK as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ui-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
