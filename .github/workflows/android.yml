name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          echo "=== COMPILER / TEST ERRORS ==="
          grep -E "^e: |^w: .*(Unresolved|Deprecated)|error:|FAILED|AssertionError|What went wrong|Execution failed" -A2 build.log | grep -v "^\s*at " | head -120

      - name: Lint
        run: ./gradlew --console=plain :app:lintDebug
        continue-on-error: true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talks-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
